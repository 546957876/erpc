name: Admin images

on:
  push:
    branches:
      - main
      - codex/admin-web
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: erpc-admin
            file: Dockerfile.admin
          - name: erpc-web
            file: Dockerfile.web

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Push image to GHCR
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
        run: docker push "$IMAGE"

      - name: Export image for restricted networks
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          ARCHIVE: ${{ matrix.name }}-${{ github.sha }}.tar.gz
        run: docker save "$IMAGE" | gzip -1 > "$ARCHIVE"

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.name }}-${{ github.sha }}.tar.gz
          retention-days: 7
